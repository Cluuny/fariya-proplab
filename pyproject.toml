[project]
name = "prop-lab"
version = "0.1.0"
description = "Sistema de investigacion y backtesting para swing trading en cuentas de fondeo"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "pyarrow>=17.0",
]

[project.optional-dependencies]
fast = ["polars>=1.0"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
