id: H008

# --- JUSTIFICACIÓN DE REAPERTURA (documentada primero) ---
reapertura:
  estado_previo: rechazada_por_datos   # AMT/volume profile (MP001 en el pipeline)
  por_que_ahora: >
    AMT/volume profile quedó rechazada_por_datos porque NO había volumen consolidado: FX es
    OTC y el "volumen" de Dukascopy es conteo de ticks de un broker, no volumen real por nivel
    de precio. Esa restricción CAMBIÓ: hay libro de órdenes completo de cripto, GRATIS, ya
    ingerido y validado (bookTicker BTCUSDT 18.5M eventos/día + aggTrades, calidad verificada,
    docs/ofi_validation.md, data/raw_crypto). El volumen traded por nivel de precio —el input
    que define VAH/VAL/POC— ahora EXISTE y es medible. Es el mismo tipo de argumento EXTERNO
    que justificó H007 tras la ampliación de universo: la restricción que la mató desapareció,
    no "a ver si esta vez sí".
  fuera_de_condicion_de_parada: true   # H008 = novena familia, FUERA de las 200 (pipeline)
  nota_parada: >
    La condición de parada del programa (docs/program_verdict.md) se declaró cumplida (8 de 8).
    H008 entra como novena familia SÓLO por el cambio de restricción de datos, con esta
    justificación explícita; NO es buscar el candidato 201 por corazonada.

# --- FUENTE ---
fuente:
  tipo: no_arbitrado                   # ver nota_literatura
  cita: "Auction Market Theory (Steidlmayer, Market Profile); volume profile (VAH/VAL/POC)"
  url: null
  fecha_publicacion: null
nota_literatura: >
  NO hay literatura ARBITRADA que valide volume profile como fuente de edge (a diferencia de
  Cont-Kukanov-Stoikov para OFI, o Moskowitz para trend). Es folklore de trading
  (Steidlmayer/CBOT Market Profile), sin Sharpe reportado creíble. Por eso la expectativa
  comprometida (abajo) NO se ancla en un bruto de literatura sino en un argumento de
  REDUNDANCIA (los niveles de perfil coinciden con niveles simples gratis).

# --- CLASIFICACIÓN ---
familia: microstructure
mecanismo: >
  Teoría de subasta: el mercado subasta hasta encontrar valor; el precio tiende a rechazar
  extensiones fuera del área de valor (VAH/VAL) y volver al POC (precio de mayor volumen). La
  hipótesis operable es la aceptación/rechazo FUERA del área de valor.
explicacion_economica: conductual + estructura de subasta (no verificada empíricamente)
estructura: time_series
direccionalidad: mean_reversion        # fade de extensiones fuera del VA hacia el POC
clase_de_dato: flujo                   # volumen traded por nivel de precio
frecuencia: intraday_bar

# --- OPERABILIDAD / DATOS (fijados AHORA) ---
instrumentos: [BTCUSDT, ETHUSDT]       # ETH desde el INICIO: duplica T y evita un veredicto irresoluble
n_instrumentos: 2
concesion_correlacion: >
  ETH y BTC correlacionan ~0.8 → los episodios NO son del todo independientes. N_eff de un par a
  ρ=0.8 = 2/(1+0.8) = 1.11× (no 2×): la T efectiva es ~81 episodios/año (no 146), ~162 sobre 2
  años. Para un test de REDUNDANCIA DE NIVELES la concesión es ACEPTABLE (y mejor que un veredicto
  'underpowered' irresoluble con un solo instrumento). Se documenta explícitamente y la T efectiva
  se descuenta por correlación en el reporte de poder.
datos_requeridos:
  - "aggTrades (5-64 MB/día): volumen traded por nivel de precio → define el PERFIL. IMPRESCINDIBLE."
  - "bookTicker (144-384 MB/día): mid de ejecución. A VERIFICAR si es necesario (ver abajo)."
datos_ya_disponibles: true             # data.binance.vision, gratis, ya ingerido (Bloque 1 cripto)
costo_datos_usd_mes: 0
verificacion_datos:
  # (3.2) confirmar si bookTicker hace falta o si el mid se deriva de aggTrades con precisión
  # suficiente para entradas LÍMITE en el borde del VA.
  pregunta: "¿basta aggTrades (mid ≈ último trade / VWAP corto) para colocar límites en el borde
    del VA, o hace falta el mejor bid/ask de bookTicker?"
  decision: >
    Si aggTrades basta, la descarga es ~10× más ligera (5-64 MB vs 144-384 MB/día). Resolver ESTO
    con 1 día antes de bajar dos años (ver plan_descarga).
plan_descarga:
  # (3.3) MEDIR UN DÍA ANTES DE BAJAR DOS AÑOS. El cuello del proyecto es RAM, no cómputo (sorts
  # de 30M filas hacen swap, docs/ofi_validation.md).
  paso_1: "Descargar 1 DÍA (BTCUSDT + ETHUSDT, aggTrades ± bookTicker). Medir GB, tiempo de proceso
    y pico de RAM."
  paso_2: "Extrapolar a 730 días × 2 instrumentos ANTES de lanzar la descarga completa. Si el pico
    de RAM no cabe, procesar por chunks/día y no cargar todo en memoria."
  regla: "NO se baja la muestra completa sin el paso 1."
ventana_de_perfil: "rodante de 24 h previas (perfil DIARIO); VAH/VAL = área de valor del 70%
  alrededor del POC; POC = bucket de mayor volumen"
bucket_de_precio: "$10 (100 ticks de $0.10) — primario; $5 como ÚNICO chequeo de robustez"
operable_en_prop: true

# --- HIPÓTESIS TESTEABLE (versión INCREMENTAL, innegociable) ---
hipotesis: >
  NO "¿funciona el volume profile?" sino: ¿el VAH/VAL/POC aporta información INCREMENTAL sobre
  niveles de precio SIMPLES (máx/mín de N períodos, medias móviles, bandas de vol)?
diseno_incremental:
  regla_base: >
    La MISMA regla condicional (abajo) corrida con dos conjuntos de niveles:
      (a) SIMPLES: máx/mín del día previo, SMA(20), bandas de Bollinger(20, 2σ).
      (b) PERFIL: VAH/VAL/POC del perfil de 24 h previas.
  medida: >
    Δ Sharpe = Sharpe(perfil) − Sharpe(simple), con IC95 por BOOTSTRAP PAREADO por episodios
    (mismas fechas/episodios en ambas ramas). Si el VAH aporta, Δ > 0 con IC que no cruza 0.
  coincidencia: >
    Reportar el % de episodios en que VAH ≈ máx-N-días DENTRO DE TOLERANCIA (|VAH − máx_N|/precio
    ≤ 0.10% = 10 bps) y análogo VAL≈mín-N. Si la coincidencia > 80%, la maquinaria de perfiles
    es infraestructura cara para reproducir algo gratis — y ESO ES el hallazgo (suficiente por sí
    solo para muerte por redundancia).

# --- VERSIÓN CONDICIONAL (el diseño que sí puede funcionar) ---
condicional:
  motivo: >
    El trader discrecional NO OPERA cuando no ve nada claro; nuestro cribado del OFI midió el
    efecto PROMEDIO sobre todos los intervalos y por eso no vio nada. La hipótesis debe ser
    CONDICIONAL: fade fuera del área de valor SÓLO en contextos identificables EX-ANTE, con duty
    bajo por diseño.
  contexto_deterministico: >
    Activo SÓLO si (1) el día PREVIO fue de BALANCE/rango: (high−low)_prev / ATR(14 diario) < 1.0
    (compresión de rango, subasta equilibrada, conocido al inicio de sesión); Y (2) el precio
    extiende MÁS ALLÁ del borde del área de valor del perfil previo (por encima del VAH o por
    debajo del VAL). NO "cuando el mercado está claro" — ambas condiciones son deterministas y
    ex-ante.
  regla_entrada: >
    En régimen de balance, al extenderse fuera del VA y mostrar RECHAZO (el mid re-entra al VA
    dentro de K=3 barras de 1 min), entrar fade hacia el POC con orden LÍMITE (maker) en el borde
    del VA. Dirección: short si extensión por encima del VAH, long si por debajo del VAL.
  regla_salida: >
    Objetivo = POC; stop = distancia fija más allá del borde (1× rango del VA); time-stop al
    cierre de la sesión de 24 h. Un round-trip por episodio.
  duty_cycle_estimado: 0.20            # ~20% del tiempo (días de balance × toque de borde)

# --- SUELO DE COSTES (calculado ANTES) ---
suelo_de_costes:
  round_trips_por_dia_estimado: 0.5    # pocos setups/semana; 1 rt por episodio
  fraccion_maker: 1.0                  # órdenes límite en el borde del VA
  funding_evitado: true                # intradía, cierra antes de los cortes 00/08/16 UTC
  requerido_bruto_cripto: 0.523        # sharpe_bruto_requerido_cripto(0.5, maker, sin funding)
  # TRAMPA YA MEDIDA (registrarla): duty bajo SUBE el Sharpe ACTIVO requerido.
  trampa_duty_bajo: >
    sharpe_activo_requerido(duty) = 0.40/√duty + 0.245 → duty 20% = 1.139, 10% = 1.510. Ser
    selectivo NO es gratis: aunque el coste de rotación es bajo (0.52 bruto a 0.5 rt/día maker),
    el Sharpe del PERÍODO ACTIVO tiene que ser ~1.14 para que, diluido sobre el 80% flat, la serie
    complete un neto de 0.40. El listón EFECTIVO es el mayor: ~1.14 de Sharpe activo. Muy alto.
  contra_literatura: >
    No hay bruto de literatura arbitrada para volume profile (ver nota_literatura). No se puede
    contrastar contra un número creíble; ésa es una debilidad estructural de la familia.

# --- BENCHMARK NULO (lección de H003) ---
benchmark_nulo:
  descripcion: >
    El benchmark NO es cero. Debe COMPARTIR la exposición: misma dirección (fade), mismo número
    de barras en mercado y mismos episodios, pero con NIVELES DE ENTRADA elegidos AL AZAR (precio
    aleatorio dentro del rango del día en vez de VAH/VAL/POC).
  remuestreos: 1000
  semilla: 20260824                    # fija, para reproducibilidad
  reporte: "p95 de la distribución nula del Sharpe (activo)"
  # El FALSADOR se juzga RELATIVO al p95 del nulo, NO a un Sharpe absoluto.

# --- PODER ESTADÍSTICO (lección de H003) ---
poder_estadistico:
  formula: "SE(Ŝ) ≈ √((1 + S²/2)/T), T = nº de EPISODIOS independientes (no barras)"
  episodios_estimados: >
    ~1 setup por día activo × duty 20% × 365 ≈ 73 episodios/año por instrumento. Con DOS
    instrumentos (BTC+ETH) el raw es ~146/año, pero ρ≈0.8 los descuenta a T EFECTIVA ~81/año
    (N_eff par = 1.11×). Sobre 2 años: raw ~292, EFECTIVA ~162 → SE(Ŝ)≈0.083, IC95 ±0.16 (S~0.5).
    Marginalmente por encima del umbral T=150. Con 1 instrumento/1 año (T~73) sería irresoluble.
  muestra_a_adquirir: "2 años de BTCUSDT + ETHUSDT (2022-09 → 2024-08) para T efectiva ~162."
  estado_underpowered_disponible: true   # aplica sobre todo a la dimensión incremental (1b)

# --- EXPECTATIVA COMPROMETIDA (escrita ANTES, con derivación) ---
resultado_esperado:
  delta_perfil_menos_simple_esperado: "≈ 0 (o negativo)"
  coincidencia_esperada: "> 60-80% (VAH ≈ máx-día / número redondo)"
  derivacion: >
    Los bordes del área de valor están determinados por dónde el precio pasó TIEMPO/volumen, que
    en la práctica coincide con máximos/mínimos recientes y números redondos — los mismos que
    marcan los niveles SIMPLES gratis. Por eso se espera alta coincidencia y Δ ≈ 0: el perfil
    reproduce niveles simples con maquinaria cara. Sin literatura arbitrada que sugiera lo
    contrario, la expectativa base es REDUNDANCIA.
  que_seria_redundante: >
    "El VAH es redundante con niveles simples" = Δ Sharpe (perfil − simple) ≤ 0 con IC que no
    excluye 0, Y coincidencia VAH≈máx-N > 80%. Ése es el resultado que se espera y que, de darse,
    ES el hallazgo (no un fracaso).
  veredicto_esperado: "muerta por redundancia (2), o underpowered en la dimensión incremental (1b)"
  probabilidad_previa: >
    BAJA — y no por el diseño del test sino por la MAGNITUD DEL LISTÓN. El listón efectivo
    calculado en esta misma ficha es Sharpe ACTIVO ≈ 1.14 (duty 20%). En contexto de TODO lo
    medido en el programa: mejor bruto del proyecto 0.495 (H002 carry); industria de trend ~0.32
    bruto de comisiones; order flow ratio señal/coste 0.039. H008 exige MÁS DEL DOBLE del mejor
    resultado aparecido en nueve familias, a partir de una regla SIN literatura arbitrada que la
    respalde. Se corre igual porque el propósito declarado es CERRAR la duda sobre la familia
    (¿aporta el perfil sobre niveles simples?), y para eso el test —sobre todo la condición (2),
    que se dispara limpiamente— sirve. Registrar esto AHORA para que el resultado no sorprenda.

# --- FALSADOR (congelado, disparable) ---
FALSADOR: >
  H008 se descarta si SE CUMPLE CUALQUIERA de (1), (2), (3). Las tres son INDEPENDIENTES: el
  veredicto GLOBAL puede ser MUERTA por (2) o (3) aunque (1) salga underpowered.
   (1)  Δ Sharpe (perfil − simple, bootstrap pareado) ≤ 0 con IC95 que NO cruza 0  → VAH
        REDUNDANTE, MUERTA.
   (1b) IC95 del Δ CRUZA 0  → UNDERPOWERED en la dimensión incremental (NO muerta). Se reporta el
        punto estimado y el IC y se declara explícitamente que la muestra no resuelve esa
        dimensión. RAZÓN (corrige el defecto de la v1): con T~150 y S~0.5, SE(Ŝ)≈0.087 → el IC del
        Δ sólo NO cruza 0 si |Δ|≳0.17, una diferencia enorme entre dos ramas que comparten
        regla/contexto/instrumento/episodios y sólo cambian los niveles; el "IC cruza 0" se
        dispararía casi por CONSTRUCCIÓN, no por evidencia. Se separa "no hay efecto" (1) de "no
        se puede resolver" (1b), como se corrigió en H003 (falsador absoluto que el nulo alcanzaba)
        y en la calibración de H007 (test sin poder para discriminar).
   (2)  coincidencia VAH≈máx-N-días > 80% (tolerancia 10 bps)  → infraestructura cara para algo
        gratis. Se dispara LIMPIAMENTE (no depende del poder) y es la condición MÁS informativa de
        la ficha; hallazgo suficiente por sí solo para MUERTA.
   (3)  Sharpe ACTIVO de la estrategia de perfil < p95 del nulo (niveles al azar, misma exposición)
        → no hay efecto sobre el benchmark que comparte exposición. MUERTA.
  No se reintenta con variantes salvo UN ÚNICO chequeo de robustez pre-especificado (bucket $5) y
  CONTADO (deflated Sharpe con N=2). Si (2) y (3) pasan pero (1) queda underpowered, el estado
  GLOBAL es 'underpowered' y NO se toca el holdout.

metrica_exito: >
  Para PROMOVER (a confirmación en holdout) TODAS: Δ Sharpe (perfil − simple) > 0 con IC95 que no
  cruza 0; coincidencia < 80%; Sharpe activo > p95 del nulo Y > el requerido efectivo (~1.14 a
  duty 20%). El Sharpe es invariante al apalancamiento.

