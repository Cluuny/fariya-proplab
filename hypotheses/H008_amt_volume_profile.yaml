# --- RESULTADO PARCIAL (registro post-ejecución; NO toca falsador/resultado_esperado) ---
resultado:
  bloques_corridos: "1-3 (medición + coincidencia). Bloque 4 (estrategia) PENDIENTE."
  fecha: 2026-08-24
  datos:
    aggTrades_basta: true          # (1.2) resuelto: NO hace falta bookTicker (~10× más ligero)
    medicion_1dia: "BTC 1.24M filas/16MB, ETH 783k/10MB; leer 2 días 1.1s, pico RAM 169 MB"
    extrapolacion: "730 días × 2 ≈ 19 GB comprimido; proceso por-día incremental, RAM NO es cuello"
    muestra_in_sample: "75 días-instrumento (2022-09→2024-02, días 15/28); holdout 2024-03→08 NO descargado"
    calidad: "0 problemas, sin KILL; manifiesto verificado (76 archivos)"
  coincidencia_condicion_2:
    tolerancia_bps: 10
    vah_approx_max: "5% [0, 10]"
    val_approx_min: "4% [0, 8]"
    cualquiera: "9% [3, 16]"
    mediana_gap: "|VAH−máx| 76 bps · |VAL−mín| 67 bps"
    dispara_2: false               # 9% ≪ 80% → la condición (2) NO se dispara
  caveat_honesto: >
    El 9% NO establece que el perfil aporte valor, y la expectativa comprometida (coincidencia
    >60-80%) NO queda limpiamente refutada tampoco: el test estaba MISMATCHED. VAH/VAL son niveles
    INTERIORES (el área del 70% recorta las colas por definición), así que un |VAH − máximo| grande
    (~70 bps) está en parte GARANTIZADO por la definición del VA — comparar un nivel interior con un
    extremo casi asegura coincidencia baja, sin medir redundancia real. Es una lección sobre el
    diseño del diagnóstico (2), no evidencia fuerte del efecto. La redundancia REAL (VAH/VAL vs
    Bollinger 2σ, ambos interiores; POC vs SMA/VWAP) la decide el Δ Sharpe del Bloque 4.
  coincidencia_bien_emparejada:
    # CORRECCIÓN DE DISEÑO DEL TEST (change h008-redundancy-paired): el diagnóstico original
    # emparejaba VAH (interior) con el máximo (extremo) → coincidencia baja garantizada por
    # geometría, no por información. Se SUSTITUYE por INTERIOR vs INTERIOR. Umbral 80% y
    # tolerancia 10 bps IDÉNTICOS (no cambia el criterio, sólo el emparejamiento).
    fecha: 2026-08-24
    n: "75 días-instrumento in-sample"
    vah_vs_bollinger_sup: "4% [0,8], mediana 415 bps"     # Bollinger 20d = banda multi-día, más ancha
    val_vs_bollinger_inf: "0% [0,0], mediana 666 bps"
    poc_vs_sma20: "0% [0,0], mediana 283 bps"
    poc_vs_vwap24h: "28% [18,38], mediana 36 bps"         # el emparejamiento MÁS limpio (mismo timescale y tipo)
    cualquiera: "32% [21,43]"
    dispara_2: false                                      # 32% ≪ 80%, IC lejos de 80%
    lectura: >
      Ni siquiera bien emparejado dispara la condición (2). El POC NO es un VWAP caro: difieren
      ~36 bps de mediana (el modo del volumen ≠ la media del volumen; la distribución no es
      simétrica). Las comparaciones con Bollinger/SMA(20) son multi-día vs perfil de 1 día → otro
      desajuste de timescale, por eso salen aún más bajas; se ponderan menos que POC-vs-VWAP. La
      REDUNDANCIA de niveles NO queda establecida → la pregunta incremental sigue ABIERTA y la
      decide el Δ Sharpe del Bloque 4.
  siguiente: >
