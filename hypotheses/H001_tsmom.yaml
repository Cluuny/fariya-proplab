# =============================================================================
# H001 — Time-Series Momentum (TSMOM)
# Ficha de PRE-REGISTRO (protocolo anti-autoengaño, documento maestro §3.5/§7.1).
# El FALSADOR y la regla testeable se escriben ANTES de correr nada. No se editan
# cuando aparezca un resultado que guste. La señal se implementa en un change
# aparte, contra este contrato.
# =============================================================================

id: H001

fuente:
  tipo: paper
  cita: "Moskowitz, Ooi & Pedersen (2012), Time Series Momentum, Journal of Financial Economics"
  url: "https://www.sciencedirect.com/science/article/abs/pii/S0304405X11002613"
  fecha_publicacion: 2012

# --- CLASIFICACIÓN ---
familia: trend
mecanismo: conductual + riesgo
explicacion_economica: >
  Subreacción a información nueva (conductual) más una prima por transferencia de
  riesgo: los productores/hedgers comerciales pagan por cubrirse, y el especulador
  que toma el otro lado cobra esa prima montado en la tendencia. Contraparte: los
  hedgers comerciales que aceptan perder en promedio a cambio de certeza.
estructura: time_series          # cada instrumento contra su propio pasado, NO cross-sectional
direccionalidad: long_short

# --- OPERABILIDAD (adaptado a NUESTRO setup real, no al del paper) ---
# ADAPTACIÓN: el paper usa 58 futuros líquidos; nosotros 9 instrumentos spot/CFD.
# Menos diversificación → el Sharpe ~1.2 del paper NO es nuestro listón.
instrumentos: [EURUSD, GBPUSD, USDJPY, AUDUSD, USDCAD, XAUUSD, SPX500, GER40, JPN225]
n_instrumentos: 9
frecuencia_datos: diaria
horizonte_holding_dias: 21        # rebalanceo mensual
datos_requeridos: [precio_ohlc]
costo_datos_usd_mes: 0            # Dukascopy gratis
operable_en_prop: true            # swing, diario, sin cross-sectional de acciones
razon_si_no: null

# --- RESULTADO ORIGINAL ---
periodo_original: "1965-2009"
sharpe_reportado: 1.2             # portafolio de 58 futuros — NO es nuestro listón (ver n_instrumentos)
max_dd_reportado: null
n_operaciones: ">2000"
costos_incluidos: true

# --- EVIDENCIA EXTERNA ---
veredicto_externo: confirmado_con_degradacion
replicaciones_encontradas:
  - "AQR (2017): confirma el efecto out-of-sample"
  - "CXO Advisory (2019): degradación material post-2010"

# --- HIPÓTESIS TESTEABLE ---
hipotesis: >
  El signo del retorno a 12 meses de un instrumento predice positivamente su
  retorno del mes siguiente, en nuestro panel de 9 instrumentos (FX majors, oro,
  índices de renta variable).
regla_entrada: "long si ret_12m > 0, short si ret_12m < 0"
# ADAPTACIÓN: ret_12m = retorno de 12 MESES de CALENDARIO por instrumento, sobre
# su propio calendario de cotización (el motor es gap-safe). NO 252 barras fijas.
regla_salida: "rebalanceo mensual (ver rebalanceo, abajo)"
rebalanceo:
  # El día de decisión debe ser determinista; la ejecución es del motor (shift 1).
  dia_decision: "primer día hábil de cada mes"
  si_no_cotiza: >
    Si un instrumento no cotiza el primer día hábil del mes, su decisión usa el
    último precio disponible (ya forward-filled) y la ejecución cae en su
    siguiente día de cotización vía el shift(1) del motor. No se salta el mes.
alineacion:
  # Escrito aunque esté en engine._asset_returns: el pre-registro lo exige fijado.
  frame: "unión de fechas de cotización de los 9 instrumentos"
  precio: "forward-fill del precio por instrumento sobre el frame unión"
  retorno_hueco: >
    El retorno que cruza un hueco de calendario se atribuye al día de REAPERTURA
    del instrumento (no se dropea ni se adelanta); un día no cotizado rinde 0.
    Coincide con engine._asset_returns (prices.ffill().pct_change()).
sizing: >
  Volatilidad inversa: pesos relativos w_i proporcionales a 1/vol_i, con vol_i
  estimada por engine.rolling_vol (gap-safe, sobre días propios de cada
  instrumento). Luego un escalado GLOBAL del portafolio para apuntar a ~8% de
  volatilidad anual de PORTAFOLIO (documento §1.2), NO 10% por instrumento.
  EX-ANTE (obligatorio): ese escalado es un ESCALAR RODANTE que en cada fecha usa
  SÓLO la vol de portafolio observada hasta esa fecha, NUNCA la vol realizada de
  toda la serie —eso sería look-ahead en la capa de señal, que el guard del motor
  no atrapa. Se resuelve en UN PASO, sin iterar (la aparente circularidad
  vol↔escalar no requiere bucle de convergencia): (1) construir la serie de
  retornos del portafolio SIN escalar con los pesos de vol-inversa normalizados;
  (2) estimar su vol rodante a 63 días (anualizada), desplazada 1 día para usar
  sólo info hasta t-1; (3) escalar = vol_target(8%) / vol_estimada. No afecta al
  falsador (el Sharpe es invariante al escalado) pero un backtest con look-ahead
  en el sizing ensucia el diagnóstico del simulador. Exposición bruta acotada por
  config.MAX_GROSS_EXPOSURE (=4); si el escalado a 8% excede el bruto máximo, se
  recorta ESE día y se documenta.
universo_test:
  # DOS muestras REPORTADAS POR SEPARADO (no una corrida agrupada): agrupado no se
  # puede atribuir un buen resultado a un régimen ni VER la degradación post-2010.
  muestra_A:
    descripcion: "FX + oro, incluye la crisis de 2008 (único régimen de estrés real disponible)"
    instrumentos: [EURUSD, GBPUSD, USDJPY, AUDUSD, USDCAD, XAUUSD]
    periodo: "2004-2026"
    nota: "~22% de días-instrumento son pre-2010; ahí está 2008. Es el test de estrés."
  muestra_B:
    descripcion: "los 9 instrumentos, todos con 12 meses de lookback completo"
    instrumentos: [EURUSD, GBPUSD, USDJPY, AUDUSD, USDCAD, XAUUSD, SPX500, GER40, JPN225]
    periodo: "2015-2026"
    nota: "GER40 arranca 2013-09-30 → tradeable desde ~2014-10; se toma 2015 por holgura."
costos: >
  El motor aplica spread, slippage y swap. NOTA: el swap actual NO tiene dirección
  (siempre resta sobre |peso|) — aproximación CONSERVADORA aceptable para trend
  (errar hacia abajo es el lado seguro). Es bloqueante de H002/carry, no de H001.
sensibilidad_costos:
  # El swap es un placeholder; el veredicto no debe depender de él sin decirlo.
  # Y sensibilidad debe ser sensibilidad, NO seis oportunidades de cruzar 0.4:
  # con 3 swaps × 2 muestras serían 6 tiros al mismo blanco (multiplicidad).
  swap_bp_dia: [0.0, 0.3, 1.0]
  especificacion_primaria: 0.3   # el VEREDICTO de cada muestra se dicta SOBRE ESTA
  regla: >
    El veredicto de cada muestra se dicta con swap=0.3 bp/día (especificación
    primaria). Las corridas con 0.0 y 1.0 son DIAGNÓSTICO de robustez: se
    reportan siempre, pero NO son oportunidades adicionales de promover. Si el
    veredicto cambiaría de lado del falsador dentro del rango [0.0, 1.0], se
    declara que el veredicto es sobre el PLACEHOLDER de swap y no sobre la
    estrategia (no se elige la corrida que guste).
holdout: exento
holdout_razon: >
  H001 es una replicación de un efecto publicado (paper 1965-2009) SIN tuneo sobre
  nuestros datos: esa es la razón de la exención, no la cronología. NOTA de
  precisión: la Muestra A (2004-2026) sí solapa el final de la ventana del paper
  (2004-2009 ∈ 1965-2009), pero sobre instrumentos spot distintos a los 58 futuros
  del paper y sin optimizar ningún parámetro contra nuestra data. Ver
  hypotheses/HOLDOUT.md y config.HOLDOUT_START (2023-08-17); el holdout sagrado
  rige desde la primera hipótesis de DESCUBRIMIENTO (H002 en adelante).
# Expectativa COMPROMETIDA antes de correr: sin esto, un 0.45 se leería como éxito
# y un 0.25 como "mi universo es distinto" — ambas lecturas serían post-hoc.
resultado_esperado:
  sharpe_central: 0.40
  rango: [0.25, 0.60]
  derivacion: >
    Ley Fundamental de la gestión activa (Grinold-Kahn): IR ≈ IC·√BR.
    1.2 × √(9/58) = 0.47 naive; la amplitud efectiva es menor que 9 (el factor USD
    lo comparten 5 pares; los 3 índices correlacionan 0.5-0.7) → ~4-5 apuestas
    independientes → ~0.35-0.45; la degradación post-2010 (CXO) resta.
  desviaciones:
    - "9 vs 58 instrumentos → BAJA el Sharpe (efecto dominante, menos amplitud)"
    - "diario vs mensual → NEUTRO en Sharpe, SUBE turnover y costos"
    - "CFD spot vs futuros → BAJA (swap peor, sin roll yield)"
    - "2004-2026 vs 1965-2009 → BAJA (degradación post-2010 documentada)"
metrica_exito: >
  Sharpe NETO (tras costos) > 0.4 EN UNA MUESTRA → viable en ese régimen, promueve.
  Se evalúa POR MUESTRA (A y B por separado), no agrupado. El Sharpe es INVARIANTE
  al apalancamiento, por eso el veredicto no depende de optimal_leverage (diferido
  al objetivo umbral, sem 9-10). P(pasar challenge) del simulador es diagnóstico
  secundario, NO falsador.
zona_marginal:
  # Sharpe neto en [0.2, 0.4]: es donde Grinold-Kahn dice que es más probable que
  # caiga. Un limbo sin regla es donde vive la tentación de probar variantes.
  rango: [0.2, 0.4]
  decision: un_chequeo_robustez
  regla: >
    Se corre UNA sola variante pre-especificada —lookback de 6 meses en vez de
    12— y se reporta el DEFLATED Sharpe (corrección por multiplicidad). NINGUNA
    variante más: ni tuneo de vol target, ni de umbrales, ni de instrumentos.
  conteo_intentos: >
    intentos_realizados = 4 cuando se dispara el chequeo: 2 lookbacks (12m, 6m) ×
    2 muestras (A, B) = 4 configuraciones genuinas de la hipótesis. Las 3 corridas
    de swap NO cuentan (son sensibilidad de la MISMA especificación, no hipótesis
    distintas). Subestimar el conteo infla el deflated Sharpe —justo el sesgo que
    la corrección elimina. (Sin chequeo, intentos = 2: 12m × 2 muestras.)
  regla_decision: >
    Promueve SÓLO si el DEFLATED Sharpe (con N = intentos_realizados) de la mejor
    variante supera 0.4. Si no, estado = parked: nota escrita, cero trabajo
    adicional; se revisa únicamente si el portafolio de la sem 10 la necesita como
    diversificador. El deflated Sharpe es criterio, no adorno.
FALSADOR: >
  Falsador de nivel: si el Sharpe NETO < 0.2 en una muestra, H001 se descarta en
  ese régimen y NO se reintenta con variantes (salvo el único chequeo de
  zona_marginal si cae en [0.2, 0.4]). Regla de DOS MUESTRAS (devuelve la cláusula
  post-2010 que la evidencia externa marca como lo más relevante): si la Muestra A
  (2004-2026, incluye 2008) funciona (Sharpe ≥ 0.4) y la Muestra B (2015-2026) no
  (< 0.2), el HALLAZGO es la degradación post-2010 —H001 no se declara viable en
  régimen moderno, se documenta como efecto degradado, NO como molestia.

# --- GESTIÓN DE COLA ---
score_prioridad: null            # se asigna con el score §5.1 al entrar en cola de tests
estado: pre_registrado
intentos_realizados: 0
fecha_test: null
enmiendas:
  # La ficha se puede fortalecer SÓLO mientras nada se haya ejecutado. Tras el
  # primer test (fecha_test != null) el falsador y resultado_esperado se CONGELAN.
  - fecha: 2026-08-18
    tipo: pre_ejecucion            # intentos_realizados=0, fecha_test=null
    que: >
      Dos muestras separadas (A: FX+oro 2004-2026 con 2008; B: los 9 2015-2026);
      cláusula post-2010 devuelta al falsador; regla escrita para la zona marginal
      [0.2,0.4] (un chequeo de robustez); resultado_esperado con derivación
      Grinold-Kahn y dirección por desviación; sensibilidad al swap; vol-targeting
      ex-ante; rebalanceo y alineación deterministas.
  - fecha: 2026-08-18
    tipo: pre_ejecucion            # sigue intentos_realizados=0, fecha_test=null
    que: >
      Especificación primaria del swap = 0.3 bp (el veredicto se dicta sobre ésta,
      no 6 tiros al blanco); regla de decisión de la zona marginal (promueve sólo
      si el deflated Sharpe > 0.4, si no parked); conteo de intentos = 4 (2
      lookbacks × 2 muestras, swaps no cuentan) para no inflar el deflated Sharpe;
      recipe ex-ante del escalar en un solo paso (sin bucle de convergencia).
